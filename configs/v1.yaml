# UFC Style Embedding Engine Configuration v1
# Edit these before running any pipeline.

# === DATA SCOPE ===
# Day-2 decisions (2026-09-09). Confirmed against data/scope_analysis.json.
# 2014 + 5+ + extend => 969 fighters, 7,751 snapshot rows.
roster:
  min_ufc_bouts: 5 # 969 fighters in-era. 3+ adds 490 fighters but only 425 rows --
    # they sit at the min_prior_fights boundary, so it is noise without volume.
  exclude_dwcs: true # No-op: DWCS unreachable from the events index. Kept as tripwire.
  era_start: "2014-01-01" # Volume/quality knee. 71% of bouts, 90.4% reach coverage.
  bout_count_scope: "in_era" # 5+ counted inside the era => 7,751 rows / 969 fighters,
    # matching the day-2 memo. "career" gives 8,009 / 1,075.

history:
  min_prior_fights: 3 # Don't produce snapshot unless fighter has 3+ prior bouts.
  strategy: "extend" # Career-wide history: a 2012 bout informs 2015 style. +564 rows (8%).

# === FEATURES ===
features:
  blocks:
    proportions: true # Target/position distribution, grappling preference, pace, method
    rates: true # Per-minute, accuracy, win/finish rates
    physical: true # Height, reach, weight-class percentiles
    dispersion: true # Within-fighter spread (requires per_bout vectors)

  nan_policy: "error" # Nothing should be NaN on this snapshot. "train_median" to impute.

  shrinkage:
    enabled: true
    k: 75 # Empirical Bayes parameter (attempts to shrink over)
    k_by_evidence: # 75 attempts and 75 prior bouts are not the same evidence.
      n_prior_minutes: 20.0
      n_prior_bouts: 5.0
      n_prior_td_att: 12.0 # median is 18 td attempts; k=75 left every grappling
        # feature 81% population mean.

# === LABELING ===
labels:
  background:
    n_samples: all # every test-split fighter; was 200 when labeling meant watching video
    stratify_by: ["era_tercile", "weight_class"]
  guard:
    n_samples: 200 # Per bout, not per fighter
    per_fighter_min: 2
    compute_kappa: true

# === SPLITS ===
splits:
  train:
    date_range: ["2014-01-01", "2021-12-31"]
  val:
    date_range: ["2022-01-01", "2023-06-30"]
  test:
    date_range: ["2023-07-01", "2026-12-31"]

# === MODELS ===
training:
  device: "cpu" # Switch to "cuda" for GPU
  seed: 42

  autoencoder:
    d_in: 28 # Will be set from actual feature count
    d_latent: 8
    d_hidden: [32, 16]
    dropout: 0.15
    optimizer: "Adam"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    epochs_max: 200
    batch_size: 64
    early_stopping_patience: 20

  contrastive:
    d_in: 28
    d_latent: 8
    d_proj: 16
    optimizer: "Adam"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    epochs_max: 200
    batch_size: 64
    early_stopping_patience: 20
    nt_xent_tau: 0.1
    pair_strategy: "gapped" # "gapped" | "round_subsample" | "feature_dropout"

# === EVALUATION ===
eval:
  probe_k: 10 # k-NN for probe recovery
  matchup_bootstrap_resamples: 1000

# === PATHS (relative to repo root) ===
paths:
  raw: "data/raw"
  snapshot_date: "2026-09-01" # Data vintage. Bump deliberately, then re-run everything.
  snapshots: "data/snapshots/v1"
  per_bout: "data/per_bout/v1"
  labels: "data/labels"
  models: "data/models"
  eval: "data/eval"
  notebooks: "notebooks"
